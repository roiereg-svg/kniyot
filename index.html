<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090E1C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הקניות שלנו">
<meta name="description" content="רשימת קניות משותפת למשפחה ולחברים.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>הקניות שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Secular+One&display=swap">
<link rel="stylesheet" href="app.css">
<script>
/* Display choice before first paint: kniyot.theme = light | dark, absent = follow the device. */
(function () {
  var t = null; try { t = localStorage.getItem("kniyot.theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") return;
  document.documentElement.setAttribute("data-theme", t);
  var c = t === "dark" ? "#090E1C" : "#F2F4F8";
  document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", c); });
})();
</script>
</head>
<body>
<div id="app"><div class="screen"><div class="loading">רגע…</div></div></div>
<div id="layer"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="photoFile" accept="image/*" hidden>
<noscript><p style="padding:24px;font-size:18px">האפליקציה צריכה JavaScript כדי לעבוד.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
